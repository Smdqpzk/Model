<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 模型動畫控制面板</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

    <style>
        :root {
            --bg-color: #1a1a2e;
            --card-bg: #16213e;
            --accent: #e94560;
            --text: #ffffff;
        }

        body {
            font-family: "Microsoft JhengHei", sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin-top: 30px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }

        model-viewer {
            width: 100%;
            height: 450px;
            background: radial-gradient(circle, #252a44 0%, #1a1a2e 100%);
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .btn-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-top: 10px;
        }

        .anim-group {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            background: #0f3460;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: var(--accent);
        }

        .btn-anim {
            background: #28a745; /* 綠色代表動畫按鈕 */
        }

        .btn-stop {
            background: #dc3545; /* 紅色代表停止 */
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>3D 模型動畫控制面板</h2>
        
        <model-viewer 
            id="car-model"
            src="Model.glb" 
            alt="我的 3D 模型"
            auto-rotate
            camera-controls
            shadow-intensity="2"
            environment-image="neutral">
        </model-viewer>

        <!-- 視角切換按鈕 -->
        <div class="btn-group">
            <button onclick="changeView('0deg 75deg 105%')">車頭</button>
            <button onclick="changeView('90deg 75deg 105%')">側面</button>
            <button onclick="changeView('180deg 75deg 105%')">車尾</button>
        </div>

        <!-- 動畫控制按鈕 -->
        <div class="anim-group">
            <button class="btn-anim" onclick="playAnim('*')">▶ 播放預設動畫</button>
            <button class="btn-anim" onclick="playAnim('Animation')">▶ 播放 "Animation"</button>
            <button class="btn-stop" onclick="stopAnim()">■ 停止動畫</button>
        </div>

        <div class="info-panel">
            <p>提示：若點擊「播放預設動畫」仍無反應，請回 Blockbench 確認導出時有包含動畫軌道。</p>
        </div>
    </div>

    <script>
        const mv = document.querySelector('#car-model');

        // 切換視角
        function changeView(orbit) {
            mv.cameraOrbit = orbit;
        }

        // 播放動畫
        function playAnim(name) {
            mv.animationName = name;
            mv.play();
            console.log("正在嘗試播放動畫：" + name);
        }

        // 停止動畫
        function stopAnim() {
            mv.pause();
            console.log("動畫已停止");
        }
    </script>

</body>
</html>
