<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puma Tank V3 - 進階展示</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        :root {
            /* 重新定義調色盤 */
            --bg-color: #030303; /* 更深邃的黑色 */
            --text-main: #f0f0f0;
            --text-sub: #bdc1c6;
            --accent-color: #00e5ff; /* 賽博藍，科技感更強 */
            --highlight-color: rgba(0, 229, 255, 0.15); /* 霓虹光暈 */
            --border-color: #2a2a2a;
            --danger-color: #ff3d00; /* 工業警示紅 */
        }

        body {
            font-family: "SF Pro Display", "SF Pro Icons", "Helvetica Neue", "Microsoft JhengHei", sans-serif;
            background-color: #000;
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            letter-spacing: 0.05em;
        }

        .slide-deck {
            display: flex;
            width: 90vw; /* 略微縮小，更有層次 */
            height: 80vh;
            background: var(--bg-color);
            border-radius: 4px; /* 更銳利的直角 */
            box-shadow: 0 0 50px rgba(0,0,0,0.9), 0 0 100px rgba(0, 229, 255, 0.05); /* 加上極淡的藍色光暈 */
            overflow: hidden;
            position: relative;
            border: 1px solid var(--border-color);
            transform: perspective(1000px); /* 輕微的3D視角 */
        }

        /* 介面邊飾 */
        .slide-deck::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-color), transparent);
        }

        /* 模型區域美化 */
        .model-section {
            flex: 1.6; /* 讓模型佔比更大 */
            background: #010101;
            position: relative;
            overflow: hidden;
        }

        .model-section::after {
            content: '';
            position: absolute;
            bottom: -50px;
            left: 50%;
            width: 80%;
            height: 100px;
            background: radial-gradient(ellipse, var(--highlight-color), transparent 70%);
            transform: translateX(-50%);
            filter: blur(30px);
            pointer-events: none;
        }

        model-viewer {
            width: 100%;
            height: 100%;
            --interpolation-decay: 100;
        }

        /* 資訊區域美化 */
        .info-section {
            flex: 1;
            padding: 60px 40px; /* 增加上下間距 */
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: var(--bg-color);
            border-left: 1px solid var(--border-color);
            z-index: 10;
            position: relative;
        }

        /* 仿軍用介面圖騰 */
        .info-section::before {
            content: '';
            position: absolute;
            top: 20px; right: 20px; width: 8px; height: 8px;
            border-top: 2px solid var(--border-color);
            border-right: 2px solid var(--border-color);
        }

        .info-section::after {
            content: '';
            position: absolute;
            bottom: 20px; left: 20px; width: 8px; height: 8px;
            border-bottom: 2px solid var(--border-color);
            border-left: 2px solid var(--border-color);
        }

        .fade-in {
            animation: sciFiSlideIn 0.8s cubic-bezier(0.19, 1, 0.22, 1);
        }

        @keyframes sciFiSlideIn {
            from { opacity: 0; transform: scale(0.98) translateX(20px); }
            to { opacity: 1; transform: scale(1) translateX(0); }
        }

        /* 標題美化 */
        .label-box {
            position: relative;
        }

        #slide-title {
            font-size: 2.2em; /* 略微縮小 */
            margin: 0 0 15px 0;
            color: var(--text-main);
            text-transform: uppercase;
            font-weight: 900;
            line-height: 1.1;
            /* 工業警示紅的前綴修飾 */
            display: inline-flex;
            align-items: center;
            gap: 12px;
        }

        #slide-title::before {
            content: '';
            width: 15px;
            height: 15px;
            background-color: var(--danger-color);
            clip-path: polygon(100% 0, 100% 50%, 50% 100%, 0% 100%, 0 0);
            display: block;
        }

        /* 內容美化 */
        #slide-content {
            font-size: 1.1em;
            line-height: 1.8;
            color: var(--text-sub);
            min-height: 120px;
            white-space: pre-line;
            font-family: 'SF Pro Text', serif;
            letter-spacing: 0.02em;
        }

        /* 圖片區域美化 */
        #slide-img-container {
            position: relative;
            margin: 30px 0;
            border-radius: 2px;
            overflow: hidden;
            transition: all 0.5s ease;
        }

        #slide-img-container::before {
            content: 'SCAN_COMPLETE';
            position: absolute;
            top: 5px; right: 8px;
            font-family: monospace;
            font-size: 0.6em;
            color: var(--accent-color);
            z-index: 10;
        }

        #slide-img {
            max-width: 100%;
            max-height: 40vh; /* 確保圖片不過高 */
            object-fit: contain;
            height: auto;
            display: none; /* 預設隱藏 */
            border-radius: 2px;
            border: 1px solid var(--accent-color);
            filter: contrast(1.1) brightness(1.1);
            position: relative;
        }

        /* 作者資訊美化 */
        .author-info {
            margin-top: auto; /* 置底 */
            padding-top: 30px;
            font-weight: 300;
            color: var(--accent-color);
            font-size: 1em;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .author-info::before {
            content: 'SYS_STATUS: [ OK ]';
            display: block;
            font-family: monospace;
            font-size: 0.7em;
            color: var(--border-color);
            margin-bottom: 5px;
        }

        /* 將頁碼改為進度條 */
        .nav-progress-container {
            position: absolute;
            bottom: 30px;
            right: 40px;
            width: 250px;
            height: 10px;
            background: #111;
            border-radius: 2px;
            z-index: 20;
            border: 1px solid var(--border-color);
        }

        .nav-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, transparent, var(--accent-color));
            width: 0%; /* 動態更新 */
            transition: width 0.3s ease;
            position: relative;
        }

        .nav-progress-bar::after {
            content: '';
            position: absolute;
            right: 0; top: 0; width: 4px; height: 100%;
            background-color: var(--text-main);
            box-shadow: 0 0 10px var(--accent-color);
        }

        /* 導航提示美化 */
        .hint {
            position: absolute;
            bottom: 30px;
            left: 40px;
            font-size: 0.8em;
            font-family: monospace;
            color: var(--text-sub);
            opacity: 0.6;
            letter-spacing: 0.1em;
        }
    }
    </style>
</head>
<body>
    <div class="slide-deck">
        <div class="model-section">
            <model-viewer id="presenter" 
                src="Model.glb" 
                shadow-intensity="1.5" 
                environment-image="neutral" 
                camera-controls 
                touch-action="none" 
                interaction-prompt="none" 
                camera-orbit="180deg 75deg 105%"
                shadow-softness="0.3">
            </model-viewer>
        </div>
        <div class="info-section">
            <div id="text-container" class="label-box">
                <h1 id="slide-title">載入中...</h1>
                <p id="slide-content"></p>
                <div id="slide-img-container">
                    <img id="slide-img" src="" alt="QR_CODE">
                </div>
                <div id="author" class="author-info"></div>
            </div>
        </div>
        
        <div class="hint">[ PRESS → / ← TO NAVIGATE ]</div>
        <div class="nav-progress-container">
            <div id="nav-bar" class="nav-progress-bar"></div>
        </div>
    </div>
    <script>
        const mv = document.querySelector('#presenter');
        const imgEl = document.querySelector('#slide-img');
        const imgContainerEl = document.querySelector('#slide-img-container'); // 新增容器
        const titleEl = document.querySelector('#slide-title');
        const contentEl = document.querySelector('#slide-content');
        const authorEl = document.querySelector('#author');
        const navBarEl = document.querySelector('#nav-bar'); // 新增進度條
        const textContainer = document.querySelector('#text-container');
        let currentPage = 0;

        /* 你的 slideData 數據完全不用動，直接貼在下面即可 */
        // --- START YOUR DATA HERE ---
        const slideData = [
            { orbit: '131deg 74deg 105%',target: '0m 1m 0m', title: 'Remote Control Car', content: 'Works that started in March', author: '項正宇', showAuthor: true, hideModel: false,modelSrc: 'Model.glb' },
            { orbit: '210deg 80deg 90%',target: '0m 1m 0m', title: 'Why I made a remote control car', content: 'Because I\'m so boring', showAuthor: false, hideModel: true },
            { orbit: '90deg 85deg 190',target: '0m 1m 0m', title: 'About the car(Tank)', content: 'Materials:\n• Woodstick & Glue\n• ESP32, L298N, SG-90\n• 1.3" Displayer, TT motor\n• Pump & Solenoid Valve', showAuthor: false, hideModel: true },
            { orbit: '90deg 85deg 190%',target: '0m 1m 0m', title: 'Structure display', content: 'Modes', showAuthor: false, hideModel: false, playAnimation: false,TragetPart:["DirMotor","Power","TTMotor","TopMotor","Pump"] },
            { orbit: '90deg 85deg 190%',target: '0m 1m 0m', title: 'Structure display', content: 'Modules', showAuthor: false, hideModel: false, playAnimation: false,TragetPart:["ESP32","L298N","Displayer","ANTENNA","V","Relay"] },
            { orbit: '210deg 80deg 90%',target: '0m 1m 0m', title: 'Structure display', content: 'Overall Structure', showAuthor: false, hideModel: false, playAnimation: true,Animation:"OPEN",TragetPart:["DirMotor","Power","TTMotor","TopMotor","Pump","ESP32","L298N","Displayer","ANTENNA","V","Relay"] },
            { orbit: '180deg 170deg 90%',target: '0m 1m 0m', title: 'Bottom Structure', content: 'Steering System', showAuthor: false, hideModel: false,playAnimation: true,Animation:"R&L",TragetPart:["Bottom"] },
            { orbit: '270deg 90deg 10%',target: '-0.625m 1.462m -0.764m', title: 'ESP32 (The core of the car)', content: 'Main control unit location and wiring', showAuthor: false, hideModel: false,TragetPart:["ESP32"] },
            { orbit: '223deg 82deg 20%',target: '-0.499m 1.734m -1.788m', title: 'L298N', content: 'Bridge with motor', showAuthor: false, hideModel: false,TragetPart:["L298N"] },
            { orbit: '168deg 31deg 30%',target: '-0.017m 1.687m -3.004m', title: 'SG-90', content: 'Directional control', showAuthor: false, hideModel: false,TragetPart:["DirMotor"] },
            { orbit: '137deg 51deg 40%',target: '0.623m 1.570m -2.136m', title: 'Displayer', content: 'Status display', showAuthor: false, hideModel: false,TragetPart:["Displayer"] },
            { orbit: '137deg 51deg 30%',target: '0.494m 1.624m -2.416m', title: 'NRF24L01', content: 'Connecting device', showAuthor: false, hideModel: false,TragetPart:["ANTENNA"] },
            { orbit: '19deg 78deg 20%',target: '0.502m 1.532m -1.197m', title: 'LM2596S', content: 'Step-down module', showAuthor: false, hideModel: false,TragetPart:["V"] },
            { orbit: '-97deg 78deg 50%',target: '-0.249m 2.112m 1.936m', title: 'Relay', content: 'Control valve to open or close', showAuthor: false, hideModel: false,TragetPart:["Relay"] },
            { orbit: '423deg 88deg 50%',target: '0.437m 1.362m 1.373m', title: 'Power', content: 'Car power', showAuthor: false, hideModel: false,TragetPart:["Power"] },
            { orbit: '585deg 158deg 40%',target: '0.182m 1.249m 1.032m', title: 'TTMotor', content: 'Servo motor control', showAuthor: false, hideModel: false,TragetPart:"TTMotor" },
            { orbit: '160deg 85deg 30%',target: '0.088m 2.507m -1.562m', title: 'Turret(SG-90)', content: 'Servo motor control', showAuthor: false, hideModel: false,TragetPart:"TopMotor" },
            { orbit: '90deg 85deg 20%',target: '-0.319m 2.251m 0.190m', title: 'Pump', content: 'Cars cannon loader', showAuthor: false, hideModel: false,TragetPart:"Pump" },
            { orbit: '123deg 75deg 105%',target: '0m 1m 0m', title: 'Presentation End', content: 'Thank you', author: 'Project: Remote Control Car', showAuthor: true, hideModel: false,modelSrc: 'Mod.glb',imgSrc: 'QRCode.png' }
        ];
        // --- END YOUR DATA HERE ---

        async function updateSlide() {
            const data = slideData[currentPage];
            const modelSection = document.querySelector('.model-section');
            
            // 處理模型切換
            const targetModel = data.modelSrc || 'Model.glb';
            if (mv.getAttribute('src') !== targetModel) {
                mv.src = targetModel;
                await mv.updateComplete;
            }

            // 處理隱藏/顯示
            modelSection.style.display = data.hideModel ? 'none' : 'block';
            
            // 塗色邏輯
            function applyHighlightLogic(mv, targetList) {
                if (!mv.model || !mv.model.materials) return;
                const targets = Array.isArray(targetList) ? targetList : [targetList];
                mv.model.materials.forEach((mat) => {
                    const pbr = mat.pbrMetallicRoughness;
                    const matName = mat.name || "";
                    const texName = pbr.baseColorTexture?.texture?.name || "";
                    const isTarget = targets.some(name => name && (matName.includes(name) || texName.includes(name)));
                    pbr.setBaseColorFactor(isTarget ? [1, 1, 1, 1] : [0.15, 0.15, 0.15, 1.0]);
                });
            }
            if (mv.model) applyHighlightLogic(mv, data.TragetPart || []);

            // 處理動畫與相機
            if (data.playAnimation) {
                mv.animationName = data.Animation;
                mv.play();
            } else {
                mv.pause();
                mv.currentTime = 0;
                mv.cameraOrbit = data.orbit;
            }
            mv.cameraTarget = data.target || "auto auto auto";

            // UI 更新 (淡入動畫)
            textContainer.classList.remove('fade-in');
            void textContainer.offsetWidth; // 強制重繪
            textContainer.classList.add('fade-in');
            titleEl.innerText = data.title;
            contentEl.innerText = data.content;

            // 圖片更新邏輯
            if (data.imgSrc) {
                imgEl.src = data.imgSrc;
                imgEl.style.display = 'block'; // 顯示圖片
                imgContainerEl.style.display = 'block'; // 顯示容器
            } else {
                imgEl.style.display = 'none';  // 隱藏圖片
                imgContainerEl.style.display = 'none';  // 隱藏容器
            }

            // 更新導航進度條
            const progressPercentage = ((currentPage + 1) / slideData.length) * 100;
            navBarEl.style.width = `${progressPercentage}%`;

            authorEl.style.display = data.showAuthor ? 'block' : 'none';
            if (data.showAuthor) authorEl.innerText = data.author || '';
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' && currentPage < slideData.length - 1) { currentPage++; updateSlide(); }
            else if (e.key === 'ArrowLeft' && currentPage > 0) { currentPage--; updateSlide(); }
        });

        updateSlide(); // 初始化第一頁
    </script>
</body>
</html>
