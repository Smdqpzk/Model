<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puma Tank V3 展示</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

    <style>
        :root {
            --bg-dark: #0a0e14;
            --bg-panel: rgba(20, 26, 35, 0.8);
            --text-main: #f8fafc;
            --accent-color: #38bdf8;
        }

        body {
            font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .slide-deck {
            display: flex;
            width: 96vw;
            height: 88vh;
            background: var(--bg-panel);
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* 左側：模型展示區 (移除所有網格與特效) */
        .model-section {
            flex: 1.4; 
            background: #000000; /* 純黑背景 */
            position: relative;
        }

        model-viewer {
            width: 100%;
            height: 100%;
            --poster-color: transparent;
        }

        /* 右側：文字說明區 */
        .info-section {
            flex: 1;
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: rgba(10, 14, 20, 0.9);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
        }

        #slide-title { 
            font-size: 3em; 
            margin: 0 0 15px 0; 
            color: #fff; 
        }

        #slide-content { 
            font-size: 1.2em; 
            line-height: 1.8; 
            color: #cbd5e1; 
            white-space: pre-line;
        }

        .label-box {
            border-left: 4px solid var(--accent-color);
            padding-left: 25px;
        }

        .author-info { 
            margin-top: 40px; 
            font-weight: bold; 
            color: var(--accent-color); 
        }

        /* 頁碼調整：左下角、白色 */
        .page-footer { 
            position: absolute; 
            bottom: 30px; 
            left: 40px; 
            color: #ffffff; 
            font-family: monospace;
            font-size: 1.1em;
            z-index: 20;
        }

        .fade-in {
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="slide-deck">
        <div class="model-section">
            <model-viewer 
                id="presenter"
                src="Model.glb" 
                shadow-intensity="1"
                environment-image="neutral"
                exposure="1.2"
                camera-controls
                touch-action="none"
                camera-orbit="180deg 75deg 105%">
            </model-viewer>
        </div>

        <div class="info-section">
            <div id="text-container" class="label-box">
                <h1 id="slide-title">載入中...</h1>
                <p id="slide-content"></p>
                <div id="author" class="author-info"></div>
            </div>
        </div>

        <!-- 白色頁碼在左下角 -->
        <div id="page-num" class="page-footer"></div>
    </div>

    <script>
        const mv = document.querySelector('#presenter');
        const titleEl = document.querySelector('#slide-title');
        const contentEl = document.querySelector('#slide-content');
        const authorEl = document.querySelector('#author');
        const pageEl = document.querySelector('#page-num');
        const textContainer = document.querySelector('#text-container');

        let currentPage = 0;

        const slideData = [
            { orbit: '180deg 75deg 105%', title: 'Remote Control Car', content: 'Puma Tank V3 專案展示', author: '項正宇', showAuthor: true, hideModel: false },
            { orbit: '210deg 80deg 90%', title: '開發動機', content: '結合嵌入式系統與結構設計\n挑戰 70kg 負載實驗', showAuthor: false, hideModel: true },
            { orbit: '0deg 75deg 80%', title: 'ESP32 控制核心', content: '處理 NRF24L01 無線訊號\n執行馬達與電磁閥邏輯控制', showAuthor: false, hideModel: false, targetNode: 'ESP32' },
            { orbit: '90deg 85deg 85%', title: 'L298N 驅動模組', content: '負責驅動高電流 TT 馬達\n支援坦克轉向與動力輸出', showAuthor: false, hideModel: false, targetNode: 'L298N' },
            { orbit: '150deg 70deg 90%', title: '狀態顯示系統', content: '1.3 吋 OLED 螢幕\n即時顯示電壓與連線狀態', showAuthor: false, hideModel: false, targetNode: 'Displayer' },
            { orbit: '270deg 80deg 100%', title: '射擊機構', content: '由 Pump 與電磁閥組成的水炮系統', showAuthor: false, hideModel: false, playAnimation: true },
            { orbit: '180deg 75deg 105%', title: 'Q&A', content: '感謝您的聆聽', author: 'THE END', showAuthor: true, hideModel: false }
        ];

        function updateSlide() {
            const data = slideData[currentPage];
            const modelSection = document.querySelector('.model-section');

            // 模型顯示處理
            modelSection.style.display = data.hideModel ? 'none' : 'block';

            // 文字動畫
            textContainer.classList.remove('fade-in');
            void textContainer.offsetWidth; 
            textContainer.classList.add('fade-in');

            // 更新內容
            mv.cameraOrbit = data.orbit;
            titleEl.innerText = data.title;
            contentEl.innerText = data.content;
            pageEl.innerText = `PAGE ${currentPage + 1} / ${slideData.length}`;

            authorEl.style.display = data.showAuthor ? 'block' : 'none';
            if (data.showAuthor) authorEl.innerText = data.author || '';
        }
        
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' && currentPage < slideData.length - 1) {
                currentPage++;
                updateSlide();
            } else if (e.key === 'ArrowLeft' && currentPage > 0) {
                currentPage--;
                updateSlide();
            }
        });

        updateSlide();
    </script>
</body>
</html>
