<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

    <style>
        :root {
            --bg-color: #000000;
            --text-main: #ffffff;
            --text-sub: #bdc1c6;
            --accent-color: #1a73e8;
        }

        body {
            font-family: "Microsoft JhengHei", sans-serif;
            background-color: #0a0a0a;
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .slide-deck {
            display: flex;
            width: 95vw;
            height: 85vh;
            background: var(--bg-color);
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            overflow: hidden;
            position: relative;
            border: 1px solid #222;
        }

        .model-section {
            flex: 1.2; 
            background: #000000;
            display: block; /* 預設顯示 */
        }

        model-viewer {
            width: 100%;
            height: 100%;
            --interpolation-decay: 100;
        }

        .info-section {
            flex: 1;
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: #000000;
            border-left: 1px solid #222;
            z-index: 10;
        }

        .fade-in {
            animation: slideIn 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(50px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .label-box {
            border-left: 5px solid var(--accent-color);
            padding-left: 20px;
            transition: all 0.3s ease;
        }

        #slide-title { font-size: 2.8em; margin: 0 0 10px 0; color: var(--text-main); }
        #slide-content { font-size: 1.2em; line-height: 1.6; color: var(--text-sub); min-height: 100px; white-space: pre-line; }
        .author-info { margin-top: 30px; font-weight: bold; color: var(--accent-color); font-size: 1.1em; }

        .page-footer { 
            position: absolute; 
            bottom: 20px; 
            left: 40px;
            color: #ffffff; 
            font-family: monospace; 
            z-index: 20;
            pointer-events: none;
            font-size: 1.1em;
            background: rgba(255, 255, 255, 0.1);
            padding: 5px 12px;
            border-radius: 5px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .hint { position: absolute; bottom: 15px; right: 15px; font-size: 0.7em; color: #444; }
    </style>
</head>
<body>
    <div class="slide-deck">
        <div class="model-section">
            <model-viewer 
                id="presenter"
                src="Model.glb" 
                shadow-intensity="1"
                environment-image="neutral"
                camera-controls
                touch-action="none"
                interaction-prompt="none"
                camera-orbit="180deg 75deg 105%">
            </model-viewer>
        </div>

        <div class="info-section">
            <div id="text-container" class="label-box">
                <h1 id="slide-title">載入中...</h1>
                <p id="slide-content"></p>
                <img id="slide-img" src="" style="max-width: 100%; height: auto; display: none; margin: 20px 0; border-radius: 8px; border: 1px solid #333;">
                <div id="author" class="author-info"></div>
            </div>
        </div>

        <div id="page-num" class="page-footer">PAGE 1 / --</div>
        <div class="hint">Use Arrow Keys to Navigate</div>
    </div>

    <script>
    const mv = document.querySelector('#presenter');
    const titleEl = document.querySelector('#slide-title');
    const contentEl = document.querySelector('#slide-content');
    const authorEl = document.querySelector('#author');
    const pageEl = document.querySelector('#page-num');
    const textContainer = document.querySelector('#text-container');
    const modelSection = document.querySelector('.model-section');
    const infoSection = document.querySelector('.info-section');

    let currentPage = 0;

    // 資料表：請確保 TragetPart 的文字有出現在你的材質檔名中
    // 提示：因為你 Blockbench 裡的材質有副檔名，我們用模糊比對處理
    const slideData = [
        { orbit: '131deg 74deg 105%', target: '0m 1m 0m', title: 'Remote Control Car', content: 'Works that started in March', author: '項正宇', showAuthor: true },
        { orbit: '210deg 80deg 90%', target: '0m 1m 0m', title: 'Why I made a car', content: 'Because I\'m so boring', hideModel: true, hideborder: true },
        { orbit: '90deg 85deg 190%', target: '0m 1m 0m', title: 'Structure display', content: 'Motors', TragetPart: ["TTMotor", "Pump", "TopMotor"] },
        { orbit: '90deg 85deg 190%', target: '0m 1m 0m', title: 'Structure display', content: 'Modules', TragetPart: ["ESP32", "L298N", "V", "Relay"] },
        { orbit: '270deg 90deg 10%', target: '-0.625m 1.462m -0.764m', title: 'ESP32', content: 'Main control unit', TragetPart: ["ESP32"] },
        { orbit: '585deg 158deg 40%', target: '0.182m 1.249m 1.032m', title: 'TTMotor', content: 'Drive Motors', TragetPart: ["TTMotor"] },
        { orbit: '123deg 75deg 105%', target: '0m 1m 0m', title: 'End', content: 'Thank you!', author: 'Project: Puma Tank V3', showAuthor: true }
    ];

    /**
     * 高亮邏輯修正版：
     * 1. 支援模糊比對（忽略大小寫、副檔名）
     * 2. 處理 Blockbench 匯出材質名稱含 .png 的問題
     */
    function applyHighlightLogic(mv, targetList) {
        if (!mv.model || !mv.model.materials) return;

        const materials = mv.model.materials;
        const targets = Array.isArray(targetList) ? targetList : (targetList ? [targetList] : []);

        materials.forEach((mat) => {
            const pbr = mat.pbrMetallicRoughness;
            const matName = (mat.name || "").toLowerCase();

            // 如果該頁沒設定 target，就恢復全亮；如果有設定，則進行模糊比對
            const isTarget = targets.length === 0 || targets.some(t => {
                const search = String(t).toLowerCase();
                // 檢查材質名是否包含搜尋詞（例如 "power.png" 包含 "power"）
                return matName.includes(search);
            });

            if (isTarget) {
                pbr.setBaseColorFactor([1, 1, 1, 1]); // 原始顏色
            } else {
                pbr.setBaseColorFactor([0.15, 0.15, 0.15, 1.0]); // 變暗
            }
        });
    }

    function updateSlide() {
        const data = slideData[currentPage];

        // 佈局切換
        modelSection.style.display = data.hideModel ? 'none' : 'block';
        infoSection.style.textAlign = data.hideModel ? 'center' : 'left';
        infoSection.style.alignItems = data.hideModel ? 'center' : 'flex-start';

        // 模型更新
        mv.cameraOrbit = data.orbit;
        mv.cameraTarget = data.target || "auto auto auto";
        
        // 執行高亮（針對 Blockbench 優化）
        if (mv.model) {
            applyHighlightLogic(mv, data.TragetPart);
        }

        // 文字與動畫更新
        textContainer.classList.remove('fade-in');
        void textContainer.offsetWidth; 
        textContainer.classList.add('fade-in');

        titleEl.innerText = data.title;
        contentEl.innerText = data.content || "";
        authorEl.style.display = data.showAuthor ? 'block' : 'none';
        authorEl.innerText = data.author || '';
        pageEl.innerText = `PAGE ${currentPage + 1} / ${slideData.length}`;
    }

    // 鍵盤導航
    window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' && currentPage < slideData.length - 1) {
            currentPage++;
            updateSlide();
        } else if (e.key === 'ArrowLeft' && currentPage > 0) {
            currentPage--;
            updateSlide();
        }
    });

    // 模型載入完畢後初始化第一頁
    mv.addEventListener('load', updateSlide);
</script>
</body>
</html>
