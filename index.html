<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 測試簡報</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

    <style>
        :root {
            --bg-color: #ffffff;
            --text-main: #202124;
            --accent-color: #1a73e8;
        }

        body {
            font-family: "Microsoft JhengHei", sans-serif;
            background-color: #f8f9fa;
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .slide-deck {
            display: flex;
            width: 95vw;
            height: 85vh;
            background: var(--bg-color);
            border-radius: 12px;
            box-shadow: 0 4px 25px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        /* 左側：模型展示區（正常比例） */
        .model-section {
            flex: 1.2; 
            background: #ffffff;
            position: relative;
        }

        model-viewer {
            width: 100%; /* 回歸正常寬度 */
            height: 100%;
            margin-left: 0; /* 取消偏移 */
            --interpolation-decay: 100;
        }

        /* 右側：說明文字區 */
        .info-section {
            flex: 1;
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: #ffffff;
            border-left: 1px solid #f1f3f4;
        }

        .label-box {
            border-left: 5px solid var(--accent-color);
            padding-left: 20px;
        }

        #slide-title { font-size: 2.5em; margin: 0 0 10px 0; }
        #slide-content { font-size: 1.2em; line-height: 1.6; color: #5f6368; }
        .author-info { margin-top: 30px; font-weight: bold; color: var(--accent-color); }
        .page-footer { position: absolute; bottom: 20px; right: 40px; color: #bdc1c6; font-size: 0.8em; }
    </style>
</head>
<body>

    <div class="slide-deck">
        <div class="model-section">
            <model-viewer 
                id="presenter"
                src="Model.glb" 
                shadow-intensity="1"
                environment-image="neutral"
                interaction-prompt="none"
                camera-orbit="180deg 75deg 105%"> <!-- 105% 確保模型完整顯示 -->
            </model-viewer>
        </div>

        <div class="info-section">
            <div class="label-box">
                <h1 id="slide-title">載入中...</h1>
                <p id="slide-content">使用鍵盤左右鍵切換分頁。</p>
                <div id="author" class="author-info"></div>
            </div>
        </div>

        <div id="page-num" class="page-footer"></div>
    </div>

    <script>
        const mv = document.querySelector('#presenter');
        const titleEl = document.querySelector('#slide-title');
        const contentEl = document.querySelector('#slide-content');
        const authorEl = document.querySelector('#author');
        const pageEl = document.querySelector('#page-num');

        let currentPage = 0;

        // 統一將距離設為 105%，確保不同角度都能完整拍到全車
        const slideData = [
            { 
                orbit: '180deg 75deg 105%', 
                title: '簡報名稱', 
                content: '---',
                author: '設計者：名子',
                showAuthor: true
            },
            { 
                orbit: '0deg 75deg 105%', 
                title: '車尾細節', 
                content: '---',
                showAuthor: false
            },
            { 
                orbit: '180deg 180deg 120%', 
                title: '底盤全景', 
                content: '---',
                showAuthor: false
            },
            { 
                orbit: '270deg 80deg 110%', 
                title: '側面全景', 
                content: '---',
                showAuthor: false
            },
            { 
                orbit: '180deg 75deg 105%', 
                title: '感謝觀賞', 
                content: '這是本次 3D 作品展示的總結頁面。',
                showAuthor: true
            }
        ];

        function updateSlide() {
            const data = slideData[currentPage];
            mv.cameraOrbit = data.orbit;
            titleEl.innerText = data.title;
            contentEl.innerText = data.content;
            pageEl.innerText = `SLIDE ${currentPage + 1} / ${slideData.length}`;

            if (data.showAuthor) {
                authorEl.style.display = 'block';
                authorEl.innerText = data.author || '';
            } else {
                authorEl.style.display = 'none';
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' && currentPage < slideData.length - 1) {
                currentPage++;
                updateSlide();
            } else if (e.key === 'ArrowLeft' && currentPage > 0) {
                currentPage--;
                updateSlide();
            }
        });

        updateSlide();
    </script>
</body>
</html>
