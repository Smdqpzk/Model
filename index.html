<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 模型導覽控制面板</title>
    
    <!-- 引入 3D 模型解析組件 -->
    <script type="module" src="Model.glb"></script>

    <style>
        :root {
            --bg-color: #1a1a2e;
            --card-bg: #16213e;
            --accent: #e94560;
            --text: #ffffff;
        }

        body {
            font-family: "Microsoft JhengHei", sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin-top: 30px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }

        /* 3D 視窗設定 */
        model-viewer {
            width: 100%;
            height: 450px;
            background: radial-gradient(circle, #252a44 0%, #1a1a2e 100%);
            border-radius: 15px;
            margin-bottom: 20px;
            --interpolation-decay: 200; /* 運鏡平滑度 */
        }

        .btn-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            margin-top: 10px;
        }

        button {
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #0f3460;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: var(--accent);
            transform: translateY(-2px);
        }

        .active {
            background: var(--accent);
            box-shadow: 0 0 15px var(--accent);
        }

        .info-panel {
            margin-top: 20px;
            padding: 15px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            font-size: 0.9em;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>我的 3D 作品展示</h2>
        
        <!-- 
            src 說明：直接讀取同資料夾下的 Model.glb 
            避免 Google Drive 的 CORS 權限問題
        -->
        <model-viewer 
    id="car-model"
    src="Model.glb" 
    alt="我親手做的 3D 模型"
    auto-rotate
    camera-controls
    
    /* --- 加入下面這兩行 --- */
    autoplay
    animation-name="* " 
    /* 註：animation-name 用 "*" 代表播放第一個動畫，
       如果你有給動畫取名（如 "OpenDoor"），也可以直接填寫名稱 */
    
    shadow-intensity="2"
    environment-image="neutral"
    exposure="1">
</model-viewer>

        <div class="btn-group">
            <button onclick="changeView('0deg 75deg 105%', this)">車頭視角</button>
            <button onclick="changeView('90deg 75deg 105%', this)">側面視角</button>
            <button onclick="changeView('180deg 75deg 105%', this)">車尾視角</button>
            <button onclick="toggleAutoRotate(this)">自動旋轉：開</button>
        </div>

        <div class="info-panel">
            <p>提示：請使用 VS Code 的 Live Server 開啟此檔案，以確保模型能正常顯示。</p>
        </div>
    </div>

    <script>
        const modelViewer = document.querySelector('#car-model');

        // 切換到特定角度
        function changeView(orbit, btn) {
            modelViewer.autoRotate = false; // 定位時先停止自轉
            modelViewer.cameraOrbit = orbit;
            updateButtonStyles(btn);
        }

        // 切換自轉
        function toggleAutoRotate(btn) {
            modelViewer.autoRotate = !modelViewer.autoRotate;
            btn.innerText = modelViewer.autoRotate ? "自動旋轉：開" : "自動旋轉：關";
            updateButtonStyles(btn);
        }

        function updateButtonStyles(activeBtn) {
            document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            activeBtn.classList.add('active');
        }
    </script>

</body>
</html>
