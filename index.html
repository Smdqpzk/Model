<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 模型動畫控制面板</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

    <style>
        :root {
            --bg-color: #1a1a2e;
            --card-bg: #16213e;
            --accent: #e94560;
            --text: #ffffff;
        }

        body {
            font-family: "Microsoft JhengHei", sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin-top: 30px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }

        model-viewer {
            width: 100%;
            height: 450px;
            background: radial-gradient(circle, #252a44 0%, #1a1a2e 100%);
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #0f3460;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: var(--accent);
            transform: translateY(-2px);
        }

        .btn-play { background: #28a745; }
        .btn-stop { background: #dc3545; }
    </style>
</head>
<body>

    <div class="container">
        <h2>3D 模型展示 (單次動畫)</h2>
        
        <!-- 關鍵修正：確保這裡沒有 loop 屬性 -->
        <model-viewer 
            id="car-model"
            src="Model.glb" 
            alt="我的 3D 模型"
            auto-rotate
            camera-controls
            shadow-intensity="2"
            environment-image="neutral">
        </model-viewer>

        <div class="btn-group">
            <button class="btn-play" onclick="playAnim()">▶ 播放動畫 (播一次)</button>
            <button class="btn-stop" onclick="stopAnim()">■ 停止</button>
            <button onclick="resetView()">重置視角</button>
        </div>

        <div class="info-panel" style="margin-top: 20px; color: #888; font-size: 0.85em;">
            <p>動畫播放完畢後將自動停止在最後一格。</p>
        </div>
    </div>

    <script>
        const mv = document.querySelector('#car-model');

        // 播放動畫：指定名稱或使用 '*' 播放第一個動畫
        function playAnim() {
            // 如果你的動畫名稱不是 Animation，建議維持 '*' 比較保險
            mv.animationName = 'OPEN'; 
            mv.play();
        }

        // 停止動畫
        function stopAnim() {
            mv.pause();
        }

        // 重置視角
        function resetView() {
            mv.cameraOrbit = '0deg 75deg 105%';
        }
    </script>

</body>
</html>
