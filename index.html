<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>測試A</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

    <style>
        .page-footer { 
        position: absolute; 
        bottom: 20px; 
        left: 40px;
        color: #585858; 
        font-family: monospace; 
        z-index: 20;
        pointer-events: none;
        font-size: 1.2em;
        background: rgba(255, 255, 255, 0.5);
        padding: 5px 10px;
        border-radius: 5px;
        }

        :root {
            --bg-color: #ffffff;
            --text-main: #202124;
            --accent-color: #1a73e8;
        }

        body {
            font-family: "Microsoft JhengHei", sans-serif;
            background-color: #f8f9fa;
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .slide-deck {
            display: flex;
            width: 95vw;
            height: 85vh;
            background: var(--bg-color);
            border-radius: 12px;
            box-shadow: 0 4px 25px rgba(0,0,0,0.1);
            overflow: hidden;
            position: relative;
        }

        /* 左側：模型展示區 */
        .model-section {
            flex: 1.2; 
            background: #ffffff;
        }

        model-viewer {
            width: 100%;
            height: 100%;
            --interpolation-decay: 100;
        }

        /* 右側：文字說明區 */
        .info-section {
            flex: 1;
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: #ffffff;
            border-left: 1px solid #f1f3f4;
            z-index: 10;
        }

        /* 文字切換動畫 */
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .label-box {
            border-left: 5px solid var(--accent-color);
            padding-left: 20px;
        }

        #slide-title { font-size: 2.5em; margin: 0 0 10px 0; color: var(--text-main); }
        #slide-content { font-size: 1.2em; line-height: 1.6; color: #5f6368; min-height: 100px; }
        .author-info { margin-top: 30px; font-weight: bold; color: var(--accent-color); font-size: 1.1em; }
        .page-footer { position: absolute; bottom: 20px; right: 40px; color: #424242; font-family: monospace; }
        
        .hint { position: absolute; bottom: 15px; left: 15px; font-size: 0.7em; color: #ddd; }
    </style>
</head>
<body>

    <div class="slide-deck">
        <div class="model-section">
            <model-viewer 
                id="presenter"
                src="Model.glb" 
                shadow-intensity="1"
                environment-image="neutral"
                camera-controls
                touch-action="none"
                camera-orbit="180deg 75deg 105%">
            </model-viewer>
        </div>

        <div class="info-section">
            <div id="text-container" class="label-box">
                <h1 id="slide-title">載入中...</h1>
                <p id="slide-content"></p>
                <img id="slide-img" src="" style="max-width: 100%; height: auto; display: none; margin: 20px 0; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
                <div id="author" class="author-info"></div>
            </div>
        </div>

        <div id="page-num" class="page-footer"></div>
    </div>

    <script>
        const mv = document.querySelector('#presenter');
const imgEl = document.querySelector('#slide-img');
const titleEl = document.querySelector('#slide-title');
const contentEl = document.querySelector('#slide-content');
const authorEl = document.querySelector('#author');
const pageEl = document.querySelector('#page-num');
const textContainer = document.querySelector('#text-container');

let currentPage = 0;

const slideData = [
    { orbit: '180deg 75deg 105%', title: 'Remote Control Car', content: 'Works that started in March', author: '項正宇', showAuthor: true, hideModel: false },
    { orbit: '210deg 80deg 90%', title: 'Why I made a remote control car', content: 'Because I\'m so boring', showAuthor: false, hideModel: true },
    { orbit: '180deg 95deg 70%', title: 'About the car(Tank)', content: 'This is made of these materials:\n\n*Woodstick\n*Glue\n*ESP32,L298N,SG-90,Battery box,LM2596S,1.3inch Displayer,TT motor,Pump,Normally Closed Solenoid Valve\n*Plastic water pipes\n*Foam Board\n*Gear\n*Metal rod', showAuthor: false, hideModel: true },
    { orbit: '90deg 75deg 100%', title: '控制核心', content: '使用 ESP32 作為主要控制器，負責處理訊號與驅動。', showAuthor: false, hideModel: false, playAnimation: true, targetNode: 'ESP32' },
    { orbit: '210deg 80deg 90%', title: '顯示模組', content: '1.3 吋顯示器，用於顯示坦克當前狀態。', showAuthor: false, hideModel: false, targetNode: 'Displayer' },
    { orbit: '180deg 170deg 60%', title: '馬達驅動', content: 'L298N 模組負責提供馬達所需的電流。', showAuthor: false, hideModel: false, targetNode: 'L298N' },
    { orbit: '45deg 45deg 80%', title: '標題', content: '內容描述', showAuthor: false, hideModel: false },
    { orbit: '160deg 85deg 50%', title: '標題', content: '內容描述', showAuthor: false, hideModel: false },
    { orbit: '180deg 75deg 105%', title: '專案總結', content: '感謝觀看', showAuthor: true, hideModel: false },
    { orbit: '180deg 75deg 105%', title: '簡報結束', content: '問答時間', author: '項正宇', showAuthor: true, hideModel: false }
];

// --- 1. 新增：定義發光函式 ---
function lightUpSpecificNode(targetName) {
    if (mv && mv.model) {
        // 先重置所有材質
        mv.model.materials.forEach(m => {
            if (m.setEmissiveStrength) m.setEmissiveStrength(0);
        });

        // 尋找目標節點
        const node = mv.model.nodes.find(n => n.name === targetName);
        if (node && node.mesh) {
            node.mesh.primitives.forEach(prim => {
                const mat = prim.material;
                mat.emissiveFactor.setRGB(0, 1, 0); // 綠光
                if (mat.setEmissiveStrength) mat.setEmissiveStrength(10);
            });
        }
    }
}

// --- 2. 更新：修改後的 updateSlide ---
function updateSlide() {
    const data = slideData[currentPage];
    const modelSection = document.querySelector('.model-section');
    const infoSection = document.querySelector('.info-section');

    // 處理模型顯示與排版
    if (data.hideModel) {
        modelSection.style.display = 'none';
        infoSection.style.flex = '1'; 
        infoSection.style.textAlign = 'center';
        infoSection.style.borderLeft = 'none';
        textContainer.style.borderLeft = 'none';
        textContainer.style.paddingLeft = '0';
    } else {
        modelSection.style.display = 'block';
        infoSection.style.flex = '1';
        infoSection.style.textAlign = 'left';
        infoSection.style.borderLeft = '1px solid #f1f3f4';
        textContainer.style.borderLeft = '5px solid var(--accent-color)';
        textContainer.style.paddingLeft = '20px';
    }

    // 處理發光邏輯 (確保 model 存在)
    if (mv.model) {
        if (data.targetNode) {
            lightUpSpecificNode(data.targetNode);
        } else {
            mv.model.materials.forEach(m => {
                if (m.setEmissiveStrength) m.setEmissiveStrength(0);
            });
        }
    }

    // 處理動畫控制 (增加型別檢查預防報錯)
    if (mv && typeof mv.pause === 'function') {
        if (data.playAnimation) {
            mv.currentTime = 0;
            mv.play(); 
            setTimeout(() => {
                if (typeof mv.pause === 'function') {
                    mv.pause();
                    mv.currentTime = 0.25; 
                }
            }, 240);
        } else {
            mv.pause();
            mv.currentTime = 0; 
        }
    }

    // 更新文字內容與動畫
    textContainer.classList.remove('fade-in');
    void textContainer.offsetWidth; 
    textContainer.classList.add('fade-in');

    mv.cameraOrbit = data.orbit;
    titleEl.innerText = data.title;
    contentEl.innerText = data.content;
    pageEl.innerText = `PAGE ${currentPage + 1} / ${slideData.length}`;

    // 處理圖片顯示
    if (data.image) {
        imgEl.src = data.image;
        imgEl.style.display = 'block';
    } else {
        imgEl.style.display = 'none';
    }

    // 處理作者顯示
    authorEl.style.display = data.showAuthor ? 'block' : 'none';
    if (data.showAuthor) authorEl.innerText = data.author || '項正宇';
}

// 鍵盤監聽
window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' && currentPage < slideData.length - 1) {
        currentPage++;
        updateSlide();
    } else if (e.key === 'ArrowLeft' && currentPage > 0) {
        currentPage--;
        updateSlide();
    }
});

// 確保模型載入後才執行第一次更新，避免抓不到 model
mv.addEventListener('load', updateSlide);

// 備用初始呼叫
updateSlide();
    </script>
</body>
</html>
