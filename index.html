<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 模型專業簡報 - 視角修正版</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

    <style>
        :root {
            --bg-color: #ffffff;
            --text-main: #202124;
            --accent-color: #1a73e8;
        }

        body {
            font-family: "Microsoft JhengHei", sans-serif;
            background-color: #f0f2f5;
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .slide-deck {
            display: flex;
            width: 100vw;
            height: 100vh;
            background: var(--bg-color);
            overflow: hidden;
        }

        /* 左側：模型特寫區 */
        .model-section {
            flex: 2; /* 稍微再增加模型的權重 */
            position: relative;
            background: #ffffff;
            overflow: hidden; 
        }

        model-viewer {
            width: 100%; /* 稍微加寬，確保切掉的效果更明顯 */
            height: 90%;
            /* 調整這個數值可以讓模型更往左或往右移 */
            margin-left: -25%; 
            --interpolation-decay: 100;
        }

        /* 右側：文字說明區 */
        .info-section {
            flex: 1;
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: #ffffff;
            box-shadow: -10px 0 30px rgba(0,0,0,0.03);
            z-index: 5;
            border-left: 1px solid #f1f3f4;
        }

        .label-box {
            border-left: 6px solid var(--accent-color);
            padding-left: 25px;
        }

        #slide-title { font-size: 3em; margin: 0 0 15px 0; letter-spacing: -1px; }
        #slide-content { font-size: 1.4em; line-height: 1.8; color: #5f6368; }
        .author-info { margin-top: 40px; font-weight: bold; font-size: 1.2em; color: var(--accent-color); }
        .page-footer { position: absolute; bottom: 30px; right: 40px; color: #bdc1c6; font-family: monospace; }
    </style>
</head>
<body>

    <div class="slide-deck">
        <div class="model-section">
            <!-- 移除 camera-controls 以鎖定視角，使用 camera-target 微調中心點 -->
            <model-viewer 
                id="presenter"
                src="Model.glb" 
                shadow-intensity="1.5"
                environment-image="neutral"
                interaction-prompt="none"
                camera-target="0m 0m 0m"
                camera-orbit="180deg 75deg 65%">
            </model-viewer>
        </div>

        <div class="info-section">
            <div class="label-box">
                <h1 id="slide-title">載入中...</h1>
                <p id="slide-content">請使用鍵盤左右方向鍵切換內容。</p>
                <div id="author" class="author-info"></div>
            </div>
        </div>

        <div id="page-num" class="page-footer"></div>
    </div>

    <script>
        const mv = document.querySelector('#presenter');
        const titleEl = document.querySelector('#slide-title');
        const contentEl = document.querySelector('#slide-content');
        const authorEl = document.querySelector('#author');
        const pageEl = document.querySelector('#page-num');

        let currentPage = 0;

        // 角度修正：0deg 與 180deg 對調以修正前後方向
        const slideData = [
            { 
                orbit: '180deg 75deg 65%', 
                title: 'EMU900 數位建模', 
                content: '本次展示聚焦於細節刻畫與 3D 結構呈現。',
                author: '設計者：[你的姓名]',
                showAuthor: true
            },
            { 
                orbit: '0deg 85deg 55%', 
                title: '車尾構造', 
                content: '觀察後方連結器與排障器的工業設計細節。',
                showAuthor: false
            },
            { 
                orbit: '180deg 170deg 50%', 
                title: '精密底盤', 
                content: '底盤部分呈現了齒輪箱與支撐結構的設計。',
                showAuthor: false
            },
            { 
                orbit: '270deg 80deg 45%', 
                title: '側面視角', 
                content: '側面流線感在此視角下被無限放大。',
                showAuthor: false
            },
            { 
                orbit: '180deg 75deg 65%', 
                title: '專案總結', 
                content: '謝謝觀賞，這是我在開發過程中的實踐成果。',
                showAuthor: true
            }
        ];

        function updateSlide() {
            const data = slideData[currentPage];
            mv.cameraOrbit = data.orbit;
            titleEl.innerText = data.title;
            contentEl.innerText = data.content;
            pageEl.innerText = `SLIDE ${currentPage + 1} / ${slideData.length}`;

            if (data.showAuthor) {
                authorEl.style.display = 'block';
                authorEl.innerText = data.author || '';
            } else {
                authorEl.style.display = 'none';
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' && currentPage < slideData.length - 1) {
                currentPage++;
                updateSlide();
            } else if (e.key === 'ArrowLeft' && currentPage > 0) {
                currentPage--;
                updateSlide();
            }
        });

        updateSlide();
    </script>
</body>
</html>
