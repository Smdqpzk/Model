<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body { background-color: #1a1a2e; color: white; display: flex; flex-direction: column; align-items: center; }
        .container { width: 90%; max-width: 800px; margin-top: 30px; text-align: center; }
        model-viewer { width: 100%; height: 400px; background: #16213e; border-radius: 15px; }
        button { padding: 12px 30px; font-weight: bold; cursor: pointer; background: #28a745; color: white; border: none; border-radius: 8px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>3D 模型 (強制單次播放控制)</h2>
        
        <model-viewer 
            id="car-model"
            src="Model.glb" 
            camera-controls
            shadow-intensity="1"
            animation-name="OPEN"> <!-- 確保這裡填入你在 Blockbench 寫的動畫名，例如 OPEN -->
        </model-viewer>

        <div style="margin-top: 20px;">
            <button onclick="playOnce()">▶ 執行單次動畫</button>
        </div>
    </div>

    <script>
        const mv = document.querySelector('#car-model');

        function playOnce() {
            // 1. 先把時間歸零
            mv.currentTime = 0;
            // 2. 開始播放
            mv.play();
            
            // 3. 使用每一幀監聽，強制在結束前停下
            const checkFrame = () => {
                // 如果目前的播放時間 接近或超過 動畫總長度
                if (mv.currentTime >= mv.duration) {
                    mv.pause(); // 強制暫停
                    mv.currentTime = mv.duration; // 停在最後一格
                    return; // 結束監聽
                }
                requestAnimationFrame(checkFrame);
            };
            
            requestAnimationFrame(checkFrame);
        }

        // 另外一種保險機制：當監聽到 finished 事件時強制暫停
        mv.addEventListener('finished', () => {
            mv.pause();
        });
    </script>
</body>
</html>
