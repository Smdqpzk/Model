<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 模型專業簡報</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

    <style>
        :root {
            --bg-color: #ffffff; /* 改為白色背景 */
            --text-main: #202124;
            --accent-color: #1a73e8;
            --card-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        body {
            font-family: "Microsoft JhengHei", sans-serif;
            background-color: #f8f9fa;
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* 簡報主容器 */
        .slide-deck {
            display: flex;
            width: 95vw;
            height: 85vh;
            background: var(--bg-color);
            border-radius: 12px;
            box-shadow: var(--card-shadow);
            overflow: hidden;
        }

        /* 左側：3D 模型區（放大） */
        .model-section {
            flex: 1.5; /* 模型佔據較大空間 */
            background: radial-gradient(circle, #ffffff 0%, #eeeeee 100%);
            border-right: 1px solid #eee;
            position: relative;
        }

        model-viewer {
            width: 100%;
            height: 100%;
            --interpolation-decay: 100;
        }

        /* 右側：文字說明區 (TextLabel) */
        .info-section {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: #ffffff;
        }

        .label-box {
            border-left: 5px solid var(--accent-color);
            padding-left: 20px;
        }

        #slide-title {
            font-size: 2.5em;
            margin: 0 0 10px 0;
            color: var(--text-main);
        }

        #slide-content {
            font-size: 1.2em;
            line-height: 1.6;
            color: #5f6368;
        }

        .author-info {
            margin-top: 30px;
            font-weight: bold;
            color: var(--accent-color);
        }

        /* 頁碼提示 */
        .page-footer {
            position: absolute;
            bottom: 20px;
            right: 40px;
            font-size: 0.9em;
            color: #9aa0a6;
        }
    </style>
</head>
<body>

    <div class="slide-deck">
        <!-- 左側模型區 -->
        <div class="model-section">
            <model-viewer 
                id="presenter"
                src="Model.glb" 
                camera-controls
                shadow-intensity="1"
                environment-image="neutral"
                interaction-prompt="none"
                camera-orbit="0deg 75deg 105%">
            </model-viewer>
        </div>

        <!-- 右側文字區 (TextLabel) -->
        <div class="info-section">
            <div class="label-box">
                <h1 id="slide-title">載入中...</h1>
                <p id="slide-content">請使用左右方向鍵切換簡報內容。</p>
                <div id="author" class="author-info"></div>
            </div>
        </div>

        <div id="page-num" class="page-footer"></div>
    </div>

    <script>
        const mv = document.querySelector('#presenter');
        const titleEl = document.querySelector('#slide-title');
        const contentEl = document.querySelector('#slide-content');
        const authorEl = document.querySelector('#author');
        const pageEl = document.querySelector('#page-num');

        let currentPage = 0;

        // 簡報內容資料庫
        const slideData = [
            { 
                orbit: '0deg 75deg 100%', 
                title: '3D 數位建模作品集', 
                content: '本專案展示了利用 Blockbench 製作的高精度像素風格模型。',
                author: '設計者：[你的姓名]', // <-- 這裡請自行填入姓名
                showAuthor: true
            },
            { 
                orbit: '180deg 75deg 100%', 
                title: '車尾細節展示', 
                content: '展示車輛後方的結構設計與排氣系統細節。',
                showAuthor: false
            },
            { 
                orbit: '0deg 180deg 110%', 
                title: '底盤結構', 
                content: '從下方視角觀察模型，展示機械結構的連動感。',
                showAuthor: false
            },
            { 
                orbit: '90deg 75deg 100%', 
                title: '側面線條', 
                content: '側面展現了車身的流線型與比例平衡。',
                showAuthor: false
            },
            { 
                orbit: '0deg 75deg 100%', 
                title: '簡報結束', 
                content: '感謝您的觀賞，如有任何問題歡迎討論。',
                showAuthor: true
            }
        ];

        function updateSlide() {
            const data = slideData[currentPage];
            
            // 更新 3D 視角
            mv.cameraOrbit = data.orbit;
            
            // 更新文字標籤內容
            titleEl.innerText = data.title;
            contentEl.innerText = data.content;
            pageEl.innerText = `Page ${currentPage + 1} / ${slideData.length}`;

            // 處理第一頁的姓名顯示
            if (data.showAuthor) {
                authorEl.style.display = 'block';
                authorEl.innerText = data.author || '設計者：[你的姓名]';
            } else {
                authorEl.style.display = 'none';
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' && currentPage < slideData.length - 1) {
                currentPage++;
                updateSlide();
            } else if (e.key === 'ArrowLeft' && currentPage > 0) {
                currentPage--;
                updateSlide();
            }
        });

        updateSlide();
    </script>
</body>
</html>
