<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puma Tank V3 - Presentation</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        :root {
            --bg-body: #050505;
            --card-bg: #0a0a0a;
            --text-main: #ffffff;
            --text-sub: #888888;
            --accent-color: #00e5ff;
            --danger-color: #ff3d00;
            --border-color: #222222;
        }

        body { font-family: 'SF Pro Display', sans-serif; background-color: var(--bg-body); color: var(--text-main); margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }

        .slide-deck { display: flex; width: 90vw; height: 85vh; background: var(--card-bg); border-radius: 4px; overflow: hidden; border: 1px solid var(--border-color); position: relative; }

        /* 模型區 */
        .model-section { flex: 1.6; background: #000; position: relative; transition: flex 0.5s ease; }
        model-viewer { width: 100%; height: 100%; }

        /* 資訊區 */
        .info-section { flex: 1; padding: 60px; display: flex; flex-direction: column; border-left: 1px solid var(--border-color); position: relative; transition: all 0.5s ease; }
        
        /* 第一頁封面樣式 */
        .info-section.is-cover { flex: 2; border-left: none; align-items: center; text-align: center; justify-content: center; }
        .info-section.is-cover #slide-title { font-size: 4em; }

        #text-container { flex: 1; display: flex; flex-direction: column; justify-content: center; padding-bottom: 80px; }
        
        #slide-title { font-size: 2.2em; font-weight: 900; margin: 0 0 20px 0; text-transform: uppercase; display: inline-flex; align-items: center; gap: 15px; }
        #slide-title::before { content: ''; width: 15px; height: 15px; background-color: var(--danger-color); clip-path: polygon(100% 0, 100% 50%, 50% 100%, 0% 100%, 0 0); }
        
        #slide-content { font-size: 1.1em; color: var(--text-sub); line-height: 1.8; white-space: pre-line; }

        #slide-img-container { margin: 30px 0; }
        #slide-img { max-width: 100%; max-height: 30vh; border: 1px solid var(--accent-color); display: none; }

        .author-info { margin-top: 30px; color: var(--accent-color); font-family: monospace; }

        /* 底部導航條 */
        .nav-footer { position: absolute; bottom: 30px; left: 40px; right: 40px; height: 30px; display: flex; align-items: center; gap: 20px; }
        .nav-progress-container { flex: 1; height: 4px; background: #1a1a1a; }
        .nav-progress-bar { height: 100%; background: var(--accent-color); width: 0%; transition: width 0.4s ease; box-shadow: 0 0 10px var(--accent-color); }
        .page-counter { font-family: monospace; color: var(--text-sub); font-size: 0.9em; }
    </style>
</head>
<body>
    <div class="slide-deck">
        <div class="model-section" id="model-section">
            <model-viewer id="presenter" src="Model.glb" shadow-intensity="1.5" environment-image="neutral" camera-controls interaction-prompt="none"></model-viewer>
        </div>
        <div class="info-section" id="info-section">
            <div id="text-container">
                <h1 id="slide-title">載入中...</h1>
                <p id="slide-content"></p>
                <div id="slide-img-container"><img id="slide-img" src="" alt="Image"></div>
                <div id="author" class="author-info"></div>
            </div>
            
            <div class="nav-footer">
                <div class="nav-progress-container"><div id="nav-bar" class="nav-progress-bar"></div></div>
                <div id="page-counter" class="page-counter">01 / 19</div>
            </div>
        </div>
    </div>

    <script>
        const mv = document.querySelector('#presenter');
        const modelSection = document.querySelector('#model-section');
        const infoSection = document.querySelector('#info-section');
        const titleEl = document.querySelector('#slide-title');
        const contentEl = document.querySelector('#slide-content');
        const authorEl = document.querySelector('#author');
        const navBarEl = document.querySelector('#nav-bar');
        const pageCounterEl = document.querySelector('#page-counter');
        const imgEl = document.querySelector('#slide-img');
        const imgContainerEl = document.querySelector('#slide-img-container');
        
        let currentPage = 0;
        const slideData = [
            { orbit: '131deg 74deg 105%', title: 'Remote Control Car', content: 'A high-performance DIY tank project\nStarted in March', author: '項正宇', showAuthor: true, hideModel: true },
            { orbit: '210deg 80deg 90%', title: 'Motivation', content: 'Just for fun.\nTesting limits of small-scale automation.', showAuthor: false, hideModel: false, modelSrc: 'Model.glb' },
            /* ... 這裡放入你原本的 slideData ... */
            { orbit: '90deg 85deg 190', target: '0m 1m 0m', title: 'About the car(Tank)', content: 'Materials:\n• Woodstick & Glue\n• ESP32, L298N, SG-90\n• 1.3" Displayer, TT motor\n• Pump & Solenoid Valve', showAuthor: false, hideModel: false },
            { orbit: '90deg 85deg 190%', target: '0m 1m 0m', title: 'Structure display', content: 'Modes', showAuthor: false, hideModel: false, playAnimation: false, TragetPart:["DirMotor","Power","TTMotor","TopMotor","Pump"] },
            { orbit: '90deg 85deg 190%', target: '0m 1m 0m', title: 'Structure display', content: 'Modules', showAuthor: false, hideModel: false, playAnimation: false, TragetPart:["ESP32","L298N","Displayer","ANTENNA","V","Relay"] },
            { orbit: '210deg 80deg 90%', target: '0m 1m 0m', title: 'Structure display', content: 'Overall Structure', showAuthor: false, hideModel: false, playAnimation: true, Animation:"OPEN", TragetPart:["DirMotor","Power","TTMotor","TopMotor","Pump","ESP32","L298N","Displayer","ANTENNA","V","Relay"] },
            { orbit: '180deg 170deg 90%', target: '0m 1m 0m', title: 'Bottom Structure', content: 'Steering System', showAuthor: false, hideModel: false, playAnimation: true, Animation:"R&L", TragetPart:["Bottom"] },
            { orbit: '270deg 90deg 10%', target: '-0.625m 1.462m -0.764m', title: 'ESP32 (The core of the car)', content: 'Main control unit location and wiring', showAuthor: false, hideModel: false, TragetPart:["ESP32"] },
            { orbit: '223deg 82deg 20%', target: '-0.499m 1.734m -1.788m', title: 'L298N', content: 'Bridge with motor', showAuthor: false, hideModel: false, TragetPart:["L298N"] },
            { orbit: '168deg 31deg 30%', target: '-0.017m 1.687m -3.004m', title: 'SG-90', content: 'Directional control', showAuthor: false, hideModel: false, TragetPart:["DirMotor"] },
            { orbit: '137deg 51deg 40%', target: '0.623m 1.570m -2.136m', title: 'Displayer', content: 'Status display', showAuthor: false, hideModel: false, TragetPart:["Displayer"] },
            { orbit: '137deg 51deg 30%', target: '0.494m 1.624m -2.416m', title: 'NRF24L01', content: 'Connecting device', showAuthor: false, hideModel: false, TragetPart:["ANTENNA"] },
            { orbit: '19deg 78deg 20%', target: '0.502m 1.532m -1.197m', title: 'LM2596S', content: 'Step-down module', showAuthor: false, hideModel: false, TragetPart:["V"] },
            { orbit: '-97deg 78deg 50%', target: '-0.249m 2.112m 1.936m', title: 'Relay', content: 'Control valve to open or close', showAuthor: false, hideModel: false, TragetPart:["Relay"] },
            { orbit: '423deg 88deg 50%', target: '0.437m 1.362m 1.373m', title: 'Power', content: 'Car power', showAuthor: false, hideModel: false, TragetPart:["Power"] },
            { orbit: '585deg 158deg 40%', target: '0.182m 1.249m 1.032m', title: 'TTMotor', content: 'Servo motor control', showAuthor: false, hideModel: false, TragetPart:"TTMotor" },
            { orbit: '160deg 85deg 30%', target: '0.088m 2.507m -1.562m', title: 'Turret(SG-90)', content: 'Servo motor control', showAuthor: false, hideModel: false, TragetPart:"TopMotor" },
            { orbit: '90deg 85deg 20%', target: '-0.319m 2.251m 0.190m', title: 'Pump', content: 'Cars cannon loader', showAuthor: false, hideModel: false, TragetPart:"Pump" },
            { orbit: '123deg 75deg 105%', target: '0m 1m 0m', title: 'Presentation End', content: 'Thank you', author: 'Project: Remote Control Car', showAuthor: true, hideModel: false, modelSrc: 'Mod.glb', imgSrc: 'QRCode.png' }
        ];

        async function updateSlide() {
            const data = slideData[currentPage];
            // 封面模式邏輯
            if (currentPage === 0) {
                modelSection.style.display = 'none';
                infoSection.classList.add('is-cover');
            } else {
                modelSection.style.display = 'block';
                infoSection.classList.remove('is-cover');
                // 模型與標記邏輯... (保持原有)
            }
            // 更新文字與狀態...
            titleEl.innerText = data.title;
            contentEl.innerText = data.content;
            pageCounterEl.innerText = `${(currentPage + 1).toString().padStart(2, '0')} / ${slideData.length.toString().padStart(2, '0')}`;
            navBarEl.style.width = `${((currentPage + 1) / slideData.length) * 100}%`;
        }
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' && currentPage < slideData.length - 1) { currentPage++; updateSlide(); }
            else if (e.key === 'ArrowLeft' && currentPage > 0) { currentPage--; updateSlide(); }
        });
        updateSlide();
    </script>
</body>
</html>
