<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puma Tank V3 展示</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

    <style>
        :root {
            --bg-color: #000000; /* 改為全黑背景 */
            --text-main: #ffffff; /* 文字改為白色 */
            --text-sub: #bdc1c6;
            --accent-color: #1a73e8;
        }

        body {
            font-family: "Microsoft JhengHei", sans-serif;
            background-color: #0a0a0a;
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .slide-deck {
            display: flex;
            width: 95vw;
            height: 85vh;
            background: var(--bg-color);
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            overflow: hidden;
            position: relative;
            border: 1px solid #222;
        }

        /* 左側：模型展示區 */
        .model-section {
            flex: 1.2; 
            background: #000000;
        }

        model-viewer {
            width: 100%;
            height: 100%;
            --interpolation-decay: 100;
        }

        /* 右側：文字說明區 */
        .info-section {
            flex: 1;
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: #000000;
            border-left: 1px solid #222;
            z-index: 10;
        }

        /* 文字切入動畫 (Slide In from Right) */
        .fade-in {
            animation: slideIn 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(50px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .label-box {
            border-left: 5px solid var(--accent-color);
            padding-left: 20px;
        }

        #slide-title { font-size: 2.8em; margin: 0 0 10px 0; color: var(--text-main); }
        #slide-content { font-size: 1.2em; line-height: 1.6; color: var(--text-sub); min-height: 100px; white-space: pre-line; }
        .author-info { margin-top: 30px; font-weight: bold; color: var(--accent-color); font-size: 1.1em; }

        /* 左下角白色頁碼 */
        .page-footer { 
            position: absolute; 
            bottom: 20px; 
            left: 40px;
            color: #ffffff; 
            font-family: monospace; 
            z-index: 20;
            pointer-events: none;
            font-size: 1.1em;
            background: rgba(255, 255, 255, 0.1);
            padding: 5px 12px;
            border-radius: 5px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .hint { position: absolute; bottom: 15px; right: 15px; font-size: 0.7em; color: #444; }
    </style>
</head>
<body>

    <div class="slide-deck">
        <div class="model-section">
            <model-viewer 
                id="presenter"
                src="Model.glb" 
                shadow-intensity="1"
                environment-image="neutral"
                camera-controls
                touch-action="none"
                camera-orbit="180deg 75deg 105%">
            </model-viewer>
        </div>

        <div class="info-section">
            <div id="text-container" class="label-box">
                <h1 id="slide-title">載入中...</h1>
                <p id="slide-content"></p>
                <img id="slide-img" src="" style="max-width: 100%; height: auto; display: none; margin: 20px 0; border-radius: 8px; border: 1px solid #333;">
                <div id="author" class="author-info"></div>
            </div>
        </div>

        <div id="page-num" class="page-footer"></div>
        <div class="hint">Use Arrow Keys to Navigate</div>
    </div>

    <script>
        const mv = document.querySelector('#presenter');
        const imgEl = document.querySelector('#slide-img');
        const titleEl = document.querySelector('#slide-title');
        const contentEl = document.querySelector('#slide-content');
        const authorEl = document.querySelector('#author');
        const pageEl = document.querySelector('#page-num');
        const textContainer = document.querySelector('#text-container');

        let currentPage = 0;

        const slideData = [
            { orbit: '180deg 75deg 105%', title: 'Remote Control Car', content: 'Works that started in March', author: '項正宇', showAuthor: true, hideModel: false },
            { orbit: '210deg 80deg 90%', title: 'Why I made a remote control car', content: 'Because I\'m so boring', showAuthor: false, hideModel: true },
            { orbit: '180deg 95deg 70%', title: 'About the car(Tank)', content: 'Materials:\n• Woodstick & Glue\n• ESP32, L298N, SG-90\n• 1.3" Displayer, TT motor\n• Pump & Solenoid Valve', showAuthor: false, hideModel: true },
            { orbit: '90deg 0deg 70%', title: '動態效果展示', content: '播放模型內建動畫並旋轉展示', showAuthor: false, hideModel: false, playAnimation: true },
            { orbit: '270deg 0deg 50%', title: 'ESP32 核心', content: '主控單元位置與配線', showAuthor: false, hideModel: false },
            { orbit: '180deg 170deg 60%', title: '底盤結構', content: '驅動馬達與承重設計', showAuthor: false, hideModel: false },
            { orbit: '160deg 85deg 50%', title: '砲塔轉向', content: '伺服馬達控制細節', showAuthor: false, hideModel: false },
            { orbit: '90deg 85deg 90%', title: '電控配置', content: '降壓模組與繼電器佈線', showAuthor: false, hideModel: false },
            { orbit: '180deg 75deg 105%', title: '最後確認', content: '專案各項指標已完成', showAuthor: true, hideModel: false },
            { orbit: '180deg 90deg 125%', title: '簡報結束', content: '感謝您的聆聽', author: 'Project: Puma Tank V3', showAuthor: true, hideModel: false }
        ];

        function updateSlide() {
            const data = slideData[currentPage];
            const modelSection = document.querySelector('.model-section');
            const infoSection = document.querySelector('.info-section');

            // 1. 處理模型隱藏/顯示
            if (data.hideModel) {
                modelSection.style.display = 'none';
                infoSection.style.textAlign = 'center';
                infoSection.style.borderLeft = 'none';
                textContainer.style.borderLeft = 'none';
                textContainer.style.paddingLeft = '0';
            } else {
                modelSection.style.display = 'block';
                infoSection.style.textAlign = 'left';
                infoSection.style.borderLeft = '1px solid #222';
                textContainer.style.borderLeft = '5px solid var(--accent-color)';
                textContainer.style.paddingLeft = '20px';
            }

            // 2. 動畫與旋轉邏輯
            if (data.playAnimation) {
                mv.play();
                setTimeout(() => {
                    mv.pause();
                }, 240);
                // 獲取目前角度並旋轉 360 度 (2*PI rad)
                const currentOrbit = mv.getCameraOrbit();
                const newTheta = currentOrbit.theta + (2 * Math.PI);
                mv.cameraOrbit = `${newTheta}rad ${currentOrbit.phi}rad ${currentOrbit.radius}m`;
            } else {
                mv.pause();
                mv.currentTime = 0; 
                mv.cameraOrbit = data.orbit;
            }

            // 3. 更新文字（帶有切入動畫）
            textContainer.classList.remove('fade-in');
            void textContainer.offsetWidth; 
            textContainer.classList.add('fade-in');

            titleEl.innerText = data.title;
            contentEl.innerText = data.content;
            pageEl.innerText = `PAGE ${currentPage + 1} / ${slideData.length}`;

            // 4. 處理圖片
            if (data.image) {
                imgEl.src = data.image;
                imgEl.style.display = 'block';
            } else {
                imgEl.style.display = 'none';
            }

            // 5. 作者顯示
            authorEl.style.display = data.showAuthor ? 'block' : 'none';
            if (data.showAuthor) authorEl.innerText = data.author || '';
        }
        
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' && currentPage < slideData.length - 1) {
                currentPage++;
                updateSlide();
            } else if (e.key === 'ArrowLeft' && currentPage > 0) {
                currentPage--;
                updateSlide();
            }
        });

        updateSlide();
    </script>
</body>
</html>
