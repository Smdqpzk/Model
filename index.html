<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

    <style>
        :root {
            --bg-color: #000000;
            --text-main: #ffffff;
            --text-sub: #bdc1c6;
            --accent-color: #1a73e8;
        }

        body {
            font-family: "Microsoft JhengHei", sans-serif;
            background-color: #0a0a0a;
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .slide-deck {
            display: flex;
            width: 95vw;
            height: 85vh;
            background: var(--bg-color);
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            overflow: hidden;
            position: relative;
            border: 1px solid #222;
        }

        .model-section {
            flex: 1.2; 
            background: #000000;
            display: block; /* 預設顯示 */
        }

        model-viewer {
            width: 100%;
            height: 100%;
            --interpolation-decay: 100;
        }

        .info-section {
            flex: 1;
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: #000000;
            border-left: 1px solid #222;
            z-index: 10;
        }

        .fade-in {
            animation: slideIn 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(50px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .label-box {
            border-left: 5px solid var(--accent-color);
            padding-left: 20px;
            transition: all 0.3s ease;
        }

        #slide-title { font-size: 2.8em; margin: 0 0 10px 0; color: var(--text-main); }
        #slide-content { font-size: 1.2em; line-height: 1.6; color: var(--text-sub); min-height: 100px; white-space: pre-line; }
        .author-info { margin-top: 30px; font-weight: bold; color: var(--accent-color); font-size: 1.1em; }

        .page-footer { 
            position: absolute; 
            bottom: 20px; 
            left: 40px;
            color: #ffffff; 
            font-family: monospace; 
            z-index: 20;
            pointer-events: none;
            font-size: 1.1em;
            background: rgba(255, 255, 255, 0.1);
            padding: 5px 12px;
            border-radius: 5px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .hint { position: absolute; bottom: 15px; right: 15px; font-size: 0.7em; color: #444; }
    </style>
</head>
<body>
    <div class="slide-deck">
        <div class="model-section">
            <model-viewer 
                id="presenter"
                src="Car.glb" 
                shadow-intensity="1"
                environment-image="neutral"
                camera-controls
                touch-action="none"
                interaction-prompt="none"
                camera-orbit="180deg 75deg 105%">
            </model-viewer>
        </div>

        <div class="info-section">
            <div id="text-container" class="label-box">
                <h1 id="slide-title">載入中...</h1>
                <p id="slide-content"></p>
                <img id="slide-img" src="" style="max-width: 100%; height: auto; display: none; margin: 20px 0; border-radius: 8px; border: 1px solid #333;">
                <div id="author" class="author-info"></div>
            </div>
        </div>

        <div id="page-num" class="page-footer">PAGE 1 / --</div>
        <div class="hint">Use Arrow Keys to Navigate</div>
    </div>

    <script>
    const mv = document.querySelector('#presenter');
    const imgEl = document.querySelector('#slide-img');
    const titleEl = document.querySelector('#slide-title');
    const contentEl = document.querySelector('#slide-content');
    const authorEl = document.querySelector('#author');
    const pageEl = document.querySelector('#page-num');
    const textContainer = document.querySelector('#text-container');
    const modelSection = document.querySelector('.model-section');
    const infoSection = document.querySelector('.info-section');

    let currentPage = 0;

    const slideData = [
        { orbit: '131deg 74deg 105%', target: '0m 1m 0m', title: 'Remote Control Car', content: 'Works that started in March', author: '項正宇', showAuthor: true, hideModel: false, hideborder: false },
        { orbit: '210deg 80deg 90%', target: '0m 1m 0m', title: 'Why I made a remote control car', content: 'Because I\'m so boring', showAuthor: false, hideModel: true, hideborder: true },
        { orbit: '90deg 85deg 190', target: '0m 1m 0m', title: 'OVERVIEW', content: 'Materials:\n• About the car(Tank)\n• Structure display\n• Bottom structure\n• Details', showAuthor: false, hideModel: true, hideborder: true },
        { orbit: '90deg 85deg 190', target: '0m 1m 0m', title: 'About the car(Tank)', content: 'Materials:\n• Woodstick & Glue\n• ESP32, L298N, SG-90\n• 1.3" Displayer, TT motor\n• Pump & Solenoid Valve', showAuthor: false, hideModel: true, hideborder: true },
        { orbit: '90deg 85deg 190%', target: '0m 1m 0m', title: 'Structure display', content: 'Motors', TragetPart:["DirMotor","Power","TTMotor","TopMotor","Pump"] },
        { orbit: '90deg 85deg 190%', target: '0m 1m 0m', title: 'Structure display', content: 'Modules', TragetPart:["ESP32","L298N","Displayer","ANTENNA","V","Relay"] },
        { orbit: '210deg 80deg 90%', target: '0m 1m 0m', title: 'Structure display', content: 'overall structure', playAnimation: true, Animation:"OPEN", TragetPart:["DirMotor","Power","TTMotor","TopMotor","Pump","ESP32","L298N","Displayer","ANTENNA","V","Relay"] },
        { orbit: '180deg 170deg 90%', target: '0m 1m 0m', title: 'Bottom structure', content: 'Steering mechanism', playAnimation: true, Animation:"R&L", TragetPart:["Bottom"] },
        { orbit: '90deg 85deg 190', target: '0m 1m 0m', title: 'Details', content: '• ESP32\n• L298N\n• SG-90\n• 1.3" Displayer\n• NRF24L01\n• LM2596S\n• Relay\n• Power\n• TTMotor\n• Turret(SG-90)\n• Pump', hideModel: true },
        { orbit: '270deg 90deg 10%', target: '-0.625m 1.462m -0.764m', title: 'ESP32 (The core of the car)', content: 'Main control unit location and wiring', TragetPart:["ESP32"] },
        { orbit: '223deg 82deg 20%', target: '-0.499m 1.734m -1.788m', title: 'L298N', content: 'Motor Driver module', TragetPart:["L298N"] },
        { orbit: '168deg 31deg 30%', target: '-0.017m 1.687m -3.004m', title: 'SG-90', content: 'Steering Servo', TragetPart:["DirMotor"] },
        { orbit: '137deg 51deg 40%', target: '0.623m 1.570m -2.136m', title: 'Displayer', content: '1.3" OLED Display', TragetPart:["Displayer"] },
        { orbit: '137deg 51deg 30%', target: '0.494m 1.624m -2.416m', title: 'NRF24L01', content: '2.4G Wireless Antenna', TragetPart:["ANTENNA"] },
        { orbit: '19deg 78deg 20%', target: '0.502m 1.532m -1.197m', title: 'LM2596S', content: 'Voltage Regulator', TragetPart:["V"] },
        { orbit: '-97deg 78deg 50%', target: '-0.249m 2.112m 1.936m', title: 'Relay', content: 'Pump Switch Control', TragetPart:["Relay"] },
        { orbit: '423deg 88deg 50%', target: '0.437m 1.362m 1.373m', title: 'Power', content: 'Battery Compartment', TragetPart:["Power"] },
        { orbit: '585deg 158deg 40%', target: '0.182m 1.249m 1.032m', title: 'TTMotor', content: 'Drive Motors', TragetPart:["TTMotor"] },
        { orbit: '160deg 85deg 30%', target: '0.088m 2.507m -1.562m', title: 'Turret(SG-90)', content: 'Turret Control Servo', TragetPart:["TopMotor"] },
        { orbit: '90deg 85deg 20%', target: '-0.319m 2.251m 0.190m', title: 'Pump', content: 'Water Pump System', TragetPart:["Pump"] },
        { orbit: '123deg 75deg 105%', target: '0m 1m 0m', title: 'Presentation End', content: 'Thank you for listening', author: 'Project: Puma Tank V3', showAuthor: true }
    ];

    function applyHighlightLogic(mv, targetList) {
        if (!mv.model || !mv.model.materials) return;

        // 核心修正：確保 targetList 永遠是陣列，不論傳入的是 ["A"] 還是 "A"
        const targets = Array.isArray(targetList) ? targetList : (targetList ? [targetList] : []);

        mv.model.materials.forEach((mat) => {
            const pbr = mat.pbrMetallicRoughness;
            const matName = mat.name || "";
            
            // 如果 targets 為空陣列（代表沒設定），則全部顯示原始顏色(1,1,1)
            // 否則，只有包含在 targets 名單中的零件會亮起
            const isTarget = targets.length === 0 || targets.some(name => name && matName.includes(name));

            if (isTarget) {
                pbr.setBaseColorFactor([1, 1, 1, 1]);
            } else {
                pbr.setBaseColorFactor([0.15, 0.15, 0.15, 1.0]);
            }
        });
    }

    function updateSlide() {
        const data = slideData[currentPage];

        // 1. 佈局控制
        if (data.hideModel) {
            modelSection.style.display = 'none';
            infoSection.style.textAlign = 'center';
            infoSection.style.alignItems = 'center';
        } else {
            modelSection.style.display = 'block';
            infoSection.style.textAlign = 'left';
            infoSection.style.alignItems = 'flex-start';
        }

        // 2. 邊框與內距
        if (data.hideborder) {
            infoSection.style.borderLeft = 'none';
            textContainer.style.borderLeft = 'none';
            textContainer.style.paddingLeft = '0';
        } else {
            infoSection.style.borderLeft = data.hideModel ? 'none' : '1px solid #222';
            textContainer.style.borderLeft = '5px solid var(--accent-color)';
            textContainer.style.paddingLeft = '20px';
        }

        // 3. 模型相機與高亮
        mv.cameraOrbit = data.orbit;
        mv.cameraTarget = data.target || "auto auto auto";
        
        // 修正點：即使模型還在加載，也確保留下邏輯
        if (mv.model) {
            applyHighlightLogic(mv, data.TragetPart);
        }

        // 4. 動畫
        mv.pause();
        mv.currentTime = 0;
        if (data.playAnimation) {
            mv.animationName = data.Animation;
            if (data.Animation === "OPEN") {
                setTimeout(() => {
                    mv.play();
                    setTimeout(() => mv.pause(), 230);
                }, 500);
            } else {
                mv.play();
            }
        }

        // 5. 文字
        textContainer.classList.remove('fade-in');
        void textContainer.offsetWidth; 
        textContainer.classList.add('fade-in');
        titleEl.innerText = data.title;
        contentEl.innerText = data.content || "";
        authorEl.style.display = data.showAuthor ? 'block' : 'none';
        authorEl.innerText = data.author || '';
        pageEl.innerText = `PAGE ${currentPage + 1} / ${slideData.length}`;
    }

    window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' && currentPage < slideData.length - 1) {
            currentPage++;
            updateSlide();
        } else if (e.key === 'ArrowLeft' && currentPage > 0) {
            currentPage--;
            updateSlide();
        }
    });

    mv.addEventListener('load', () => {
        updateSlide();
    });

    document.addEventListener('DOMContentLoaded', () => {
        updateSlide();
    });
</script>
</body>
</html>
