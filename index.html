<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D簡報測試檔</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

    <style>
        :root {
            --bg-color: #ffffff;
            --text-main: #202124;
            --accent-color: #1a73e8;
        }

        body {
            font-family: "Microsoft JhengHei", sans-serif;
            background-color: #f8f9fa;
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .slide-deck {
            display: flex;
            width: 95vw;
            height: 85vh;
            background: var(--bg-color);
            border-radius: 12px;
            box-shadow: 0 4px 25px rgba(0,0,0,0.1);
            overflow: hidden;
            position: relative;
        }

        /* 左側：模型展示區 */
        .model-section {
            flex: 1.2; 
            background: #ffffff;
        }

        model-viewer {
            width: 100%;
            height: 100%;
            --interpolation-decay: 100;
        }

        /* 右側：文字說明區 */
        .info-section {
            flex: 1;
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: #ffffff;
            border-left: 1px solid #f1f3f4;
            z-index: 10;
        }

        /* 文字切換動畫 */
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .label-box {
            border-left: 5px solid var(--accent-color);
            padding-left: 20px;
        }

        #slide-title { font-size: 2.5em; margin: 0 0 10px 0; color: var(--text-main); }
        #slide-content { font-size: 1.2em; line-height: 1.6; color: #5f6368; min-height: 100px; }
        .author-info { margin-top: 30px; font-weight: bold; color: var(--accent-color); font-size: 1.1em; }
        .page-footer { position: absolute; bottom: 20px; right: 40px; color: #bdc1c6; font-family: monospace; }
        
        .hint { position: absolute; bottom: 15px; left: 15px; font-size: 0.7em; color: #ddd; }
    </style>
</head>
<body>

    <div class="slide-deck">
        <div class="model-section">
            <model-viewer 
                id="presenter"
                src="Model.glb" 
                shadow-intensity="1"
                environment-image="neutral"
                camera-controls
                touch-action="none"
                camera-orbit="180deg 75deg 105%">
                <div class="hint">滑鼠左鍵旋轉 | 右鍵平移 | 鍵盤左右鍵換頁</div>
            </model-viewer>
        </div>

        <div class="info-section">
            <div id="text-container" class="label-box">
                <h1 id="slide-title">載入中...</h1>
                <p id="slide-content"></p>
                <div id="author" class="author-info"></div>
            </div>
        </div>

        <div id="page-num" class="page-footer"></div>
    </div>

    <script>
        const mv = document.querySelector('#presenter');
        const titleEl = document.querySelector('#slide-title');
        const contentEl = document.querySelector('#slide-content');
        const authorEl = document.querySelector('#author');
        const pageEl = document.querySelector('#page-num');
        const textContainer = document.querySelector('#text-container');

        let currentPage = 0;

        const slideData = [
            { orbit: '180deg 75deg 105%', title: 'TANK', content: '字條', author: '設計者：[姓名]', showAuthor: true },
            { orbit: '210deg 80deg 90%', title: '標題', content: '字條', showAuthor: false },
            { orbit: '180deg 95deg 70%', title: '標題', content: '字條', showAuthor: false },
            { orbit: '90deg 75deg 100%', title: '標題', content: '字條', showAuthor: false },
            { orbit: '0deg 75deg 105%', title: '標題', content: '字條', showAuthor: false },
            { orbit: '180deg 170deg 60%', title: '標題', content: '字條', showAuthor: false },
            { orbit: '45deg 45deg 80%', title: '標題', content: '字條', showAuthor: false },
            { orbit: '160deg 85deg 50%', title: '標題', content: '字條', showAuthor: false },
            { orbit: '180deg 75deg 105%', title: '標題', content: '字條', showAuthor: true },
            { orbit: '180deg 75deg 105%', title: '簡報結束', content: '字條', author: '聯絡資訊：[你的 Email]', showAuthor: true }
        ];

        function updateSlide() {
            const data = slideData[currentPage];
            
            // 觸發文字動畫
            textContainer.classList.remove('fade-in');
            void textContainer.offsetWidth; // 強制重繪觸發動畫
            textContainer.classList.add('fade-in');

            // 更新模型視角
            mv.cameraOrbit = data.orbit;
            
            // 更新文字內容
            titleEl.innerText = data.title;
            contentEl.innerText = data.content;
            pageEl.innerText = `PAGE ${currentPage + 1} / ${slideData.length}`;

            if (data.showAuthor) {
                authorEl.style.display = 'block';
                authorEl.innerText = data.author || '';
            } else {
                authorEl.style.display = 'none';
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' && currentPage < slideData.length - 1) {
                currentPage++;
                updateSlide();
            } else if (e.key === 'ArrowLeft' && currentPage > 0) {
                currentPage--;
                updateSlide();
            }
        });

        updateSlide();
    </script>
</body>
</html>
