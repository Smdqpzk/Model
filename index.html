<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puma Tank V3 展示</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

    <style>
        :root {
            --bg-color: #000000; /* 改為全黑背景 */
            --text-main: #ffffff; /* 文字改為白色 */
            --text-sub: #bdc1c6;
            --accent-color: #1a73e8;
        }

        body {
            font-family: "Microsoft JhengHei", sans-serif;
            background-color: #0a0a0a;
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .slide-deck {
            display: flex;
            width: 95vw;
            height: 85vh;
            background: var(--bg-color);
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            overflow: hidden;
            position: relative;
            border: 1px solid #222;
        }

        /* 左側：模型展示區 */
        .model-section {
            flex: 1.2; 
            background: #000000;
        }

        model-viewer {
            width: 100%;
            height: 100%;
            --interpolation-decay: 100;
        }

        /* 右側：文字說明區 */
        .info-section {
            flex: 1;
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: #000000;
            border-left: 1px solid #222;
            z-index: 10;
        }

        /* 文字切入動畫 (Slide In from Right) */
        .fade-in {
            animation: slideIn 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(50px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .label-box {
            border-left: 5px solid var(--accent-color);
            padding-left: 20px;
        }

        #slide-title { font-size: 2.8em; margin: 0 0 10px 0; color: var(--text-main); }
        #slide-content { font-size: 1.2em; line-height: 1.6; color: var(--text-sub); min-height: 100px; white-space: pre-line; }
        .author-info { margin-top: 30px; font-weight: bold; color: var(--accent-color); font-size: 1.1em; }

        /* 左下角白色頁碼 */
        .page-footer { 
            position: absolute; 
            bottom: 20px; 
            left: 40px;
            color: #ffffff; 
            font-family: monospace; 
            z-index: 20;
            pointer-events: none;
            font-size: 1.1em;
            background: rgba(255, 255, 255, 0.1);
            padding: 5px 12px;
            border-radius: 5px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .hint { position: absolute; bottom: 15px; right: 15px; font-size: 0.7em; color: #444; }
    </style>
</head>
<body>
    <div id="status" style="position: fixed; bottom: 20px; left: 20px; background: rgba(0,0,0,0.7); color: white; padding: 10px; border-radius: 5px; font-family: monospace; z-index: 1000; pointer-events: none;">
        Orbit: <span id="orbit-value">Loading...</span>
    </div>
    <div class="slide-deck">
        <div class="model-section">
            <model-viewer 
                id="presenter"
                src="Model.glb" 
                shadow-intensity="1"
                environment-image="neutral"
                camera-controls
                touch-action="none"
                interaction-prompt="none"
                camera-orbit="180deg 75deg 105%">
            </model-viewer>
        </div>

        <div class="info-section">
            <div id="text-container" class="label-box">
                <h1 id="slide-title">載入中...</h1>
                <p id="slide-content"></p>
                <img id="slide-img" src="" style="max-width: 100%; height: auto; display: none; margin: 20px 0; border-radius: 8px; border: 1px solid #333;">
                <div id="author" class="author-info"></div>
            </div>
        </div>

        <div id="page-num" class="page-footer"></div>
        <div class="hint">Use Arrow Keys to Navigate</div>
    </div>

    <script>
        const mv = document.querySelector('#presenter');
        const imgEl = document.querySelector('#slide-img');
        const titleEl = document.querySelector('#slide-title');
        const contentEl = document.querySelector('#slide-content');
        const authorEl = document.querySelector('#author');
        const pageEl = document.querySelector('#page-num');
        const textContainer = document.querySelector('#text-container');

        let currentPage = 0;

        const orbitDisplay = document.querySelector('#orbit-value');

        mv.addEventListener('camera-change', () => {
            // 取得當前的相機軌道數值
            const orbit = mv.getCameraOrbit();
    
            // 將弧度 (rad) 轉換為角度 (deg) 方便閱讀
            const theta = Math.round(orbit.theta * (180 / Math.PI));
            const phi = Math.round(orbit.phi * (180 / Math.PI));
            const radius = Math.round(orbit.radius * 100) / 100; // 距離保留兩位小數

            // 顯示在畫面上，這串文字你可以直接複製去改 slideData 的 orbit
            orbitDisplay.innerText = `${theta}deg ${phi}deg ${orbit.radius}m`;
             console.log("當前中心點:", mv.getCameraTarget());
        });

        const slideData = [
            { orbit: '131deg 74deg 105%',target: '0m 1m 0m', title: 'Remote Control Car', content: 'Works that started in March', author: '項正宇', showAuthor: true, hideModel: false },
            { orbit: '210deg 80deg 90%',target: '0m 1m 0m', title: 'Why I made a remote control car', content: 'Because I\'m so boring', showAuthor: false, hideModel: true },
            { orbit: '210deg 80deg 90%',target: '0m 1m 0m', title: 'About the car(Tank)', content: 'Materials:\n• Woodstick & Glue\n• ESP32, L298N, SG-90\n• 1.3" Displayer, TT motor\n• Pump & Solenoid Valve', showAuthor: false, hideModel: true },
            { orbit: '210deg 80deg 90%',target: '0m 1m 0m', title: 'Structure display', content: 'overall structure', showAuthor: false, hideModel: false, playAnimation: true,Animation:"OPEN" },
            { orbit: '180deg 170deg 90%',target: '0m 1m 0m', title: '底盤結構', content: '驅動馬達與承重設計', showAuthor: false, hideModel: false,playAnimation: true,Animation:"R&L" },
            { orbit: '270deg 90deg 10%',target: '-0.625m 1.462m -0.764m', title: 'ESP32 (The core of the car)', content: 'Main control unit location and wiring', showAuthor: false, hideModel: false },
            { orbit: '223deg 82deg 20%',target: '-0.499m 1.734m -1.788m', title: 'L298N (The core of the car)', content: 'Main control unit location and wiring', showAuthor: false, hideModel: false },
            { orbit: '168deg 31deg 30%',target: '-0.017m 1.687m -3.004m', title: 'SG-90 (The core of the car)', content: 'Main control unit location and wiring', showAuthor: false, hideModel: false },
            { orbit: '137deg 51deg 40%',target: '0.623m 1.570m -2.136m', title: 'Displayer (The core of the car)', content: 'Main control unit location and wiring', showAuthor: false, hideModel: false },
            { orbit: '137deg 51deg 30%',target: '0.494m 1.624m -2.416m', title: 'NRF24L01 (The core of the car)', content: 'Main control unit location and wiring', showAuthor: false, hideModel: false },
            { orbit: '19deg 78deg 20%',target: '0.502m 1.532m -1.197m', title: 'LM2596S (The core of the car)', content: 'Main control unit location and wiring', showAuthor: false, hideModel: false },
            { orbit: '-97deg 78deg 50%',target: '-0.249m 2.112m 1.936m', title: 'Relay (The core of the car)', content: 'Main control unit location and wiring', showAuthor: false, hideModel: false },
            { orbit: '423deg 88deg 50%',target: '0.437m 1.362m 1.373m', title: 'Power (The core of the car)', content: 'Main control unit location and wiring', showAuthor: false, hideModel: false },
            { orbit: '585deg 158deg 40%',target: '0.182m 1.249m 1.032m', title: 'TTMotor', content: '伺服馬達控制細節', showAuthor: false, hideModel: false },
            { orbit: '160deg 85deg 30%',target: '0.088m 2.507m -1.562m', title: 'Turret(SG-90)', content: '伺服馬達控制細節', showAuthor: false, hideModel: false },
            { orbit: '90deg 85deg 20%',target: '-0.319m 2.251m 0.190m', title: 'Pump', content: '降壓模組與繼電器佈線', showAuthor: false, hideModel: false },
            { orbit: '180deg 90deg 125%',target: '0m 1m 0.2m', title: '簡報結束', content: '感謝您的聆聽', author: 'Project: Puma Tank V3', showAuthor: true, hideModel: false }
        ];

        function updateSlide() {
            const data = slideData[currentPage];
            const modelSection = document.querySelector('.model-section');
            const infoSection = document.querySelector('.info-section');

            // 1. 處理模型隱藏/顯示
            if (data.hideModel) {
                modelSection.style.display = 'none';
                infoSection.style.textAlign = 'center';
                infoSection.style.borderLeft = 'none';
                textContainer.style.borderLeft = 'none';
                textContainer.style.paddingLeft = '0';
            } else {
                modelSection.style.display = 'block';
                infoSection.style.textAlign = 'left';
                infoSection.style.borderLeft = '1px solid #222';
                textContainer.style.borderLeft = '5px solid var(--accent-color)';
                textContainer.style.paddingLeft = '20px';
            }

            // 2. 動畫與旋轉邏輯
            if (data.playAnimation) {
                if (data.Animation == "OPEN") {
                    setTimeout(() => {
                        // 第一次角度變動
                        mv.cameraOrbit = "90deg 85deg 190%";
                        mv.currentTime = 0; 
                        setTimeout(() => {
                            mv.animationName = "OPEN"; // 修正拼字：animationName
                            mv.play();
                
                            setTimeout(() => {
                                mv.pause();
                            }, 230); // 播放 230 毫秒後停止
                        }, 100); 
                    }, 1000);
                } 
                else if (data.Animation == "R&L") {
                    // 第二種動畫的邏輯
                    mv.currentTime = 0; 
                    mv.cameraOrbit = "180deg 170deg 90%";
                    mv.animationName = "R&L"; // 記得這裡要改成 "R&L"
                    mv.play();
                }
            } else {
                mv.pause();
                mv.currentTime = 0; 
                mv.cameraOrbit = data.orbit;
            }
            if (data.target) {
                mv.cameraTarget = data.target; 
            } else{
                mv.cameraTarget = "auto auto auto";
            }
            // 3. 更新文字（帶有切入動畫）
            textContainer.classList.remove('fade-in');
            void textContainer.offsetWidth; 
            textContainer.classList.add('fade-in');

            titleEl.innerText = data.title;
            contentEl.innerText = data.content;
            pageEl.innerText = `PAGE ${currentPage + 1} / ${slideData.length}`;

            // 4. 處理圖片
            if (data.image) {
                imgEl.src = data.image;
                imgEl.style.display = 'block';
            } else {
                imgEl.style.display = 'none';
            }

            // 5. 作者顯示
            authorEl.style.display = data.showAuthor ? 'block' : 'none';
            if (data.showAuthor) authorEl.innerText = data.author || '';
        }
        
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' && currentPage < slideData.length - 1) {
                currentPage++;
                updateSlide();
            } else if (e.key === 'ArrowLeft' && currentPage > 0) {
                currentPage--;
                updateSlide();
            }
        });

        updateSlide();
    </script>
</body>
</html>
